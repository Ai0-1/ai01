<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>AI 原点 | 0-1 学习交流</title>

<body class="bg-white text-slate-900">

        <section>
            <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">探索分类</h2>

    <footer class="p-10 text-center text-[10px] text-slate-400">AI Origin | 科技向善，从 0 到 1</footer>

</html>

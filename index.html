<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 原点 | 实战社区</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/supabase-js/2.39.7/supabase.min.js"></script>
    <style>
        /* ================= 极速硬核风 ================= */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: #f7f5f0; color: #333; font-family: "Verdana", sans-serif; font-size: 12px; margin: 0; padding-bottom: 60px; }
        a { text-decoration: none; color: #333; cursor: pointer; }
        
        /* 导航 */
        .top-nav { background: #2d2d2d; color: #ccc; padding: 0 10px; height: 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; color: #f0f0f0; font-size: 16px; letter-spacing: -1px; }
        .user-stat { font-size: 11px; color: #e6a23c; font-family: monospace; display: flex; align-items: center; gap: 5px; }
        .btn-action { background: #cc0000; color: #fff; padding: 4px 10px; border-radius: 2px; font-weight: bold; cursor: pointer; }
        
        /* 容器 */
        .container { max-width: 800px; margin: 0 auto; }
        
        /* 统计条 */
        .stats-bar { background: #fff; padding: 8px; border-bottom: 1px solid #ddd; display: flex; gap: 15px; font-size: 11px; color: #666; justify-content: center; }
        
        /* 帖子列表区 */
        #post-feed { min-height: 300px; padding-bottom: 20px; }
        .post-card { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 12px 10px; display: flex; gap: 10px; }
        .post-avatar { width: 36px; height: 36px; background: #f0f0f0; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #999; flex-shrink: 0; }
        .post-main { flex: 1; }
        .post-title { font-size: 14px; font-weight: bold; color: #004499; margin-bottom: 4px; display: block; }
        .post-meta { font-size: 10px; color: #999; display: flex; gap: 8px; align-items: center; }
        .tag-bounty { background: #fff7e6; color: #d48806; border: 1px solid #d48806; padding: 0 4px; border-radius: 2px; font-size: 9px; }
        
        /* 悬浮发帖按钮 */
        .fab-btn { 
            position: fixed; bottom: 30px; right: 20px; 
            width: 50px; height: 50px; background: #cc0000; color: #fff; 
            border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; z-index: 900;
        }

        /* 弹窗系统 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: #fff; width: 90%; max-width: 400px; border-radius: 4px; overflow: hidden; }
        .modal-header { background: #f5f5f5; padding: 10px 15px; font-weight: bold; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; }
        .modal-body { padding: 15px; }
        .input-field { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 3px; }
        .textarea-field { width: 100%; padding: 10px; height: 100px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 3px; resize: none; }
        .btn-submit { width: 100%; padding: 12px; background: #004499; color: #fff; border: none; font-weight: bold; border-radius: 3px; cursor: pointer; }
        
        /* 状态提示 */
        .msg-box { text-align: center; padding: 30px; color: #999; font-size: 12px; }
        .error-banner { background: #fee2e2; color: #991b1b; padding: 10px; text-align: center; font-size: 12px; display: none; }
    </style>
</head>
<body>

    <div id="err-display" class="error-banner"></div>
    <div class="top-nav">
        <div class="logo">AI 原点</div>
        <div id="auth-area">
            <div id="guest-btns">
                <span class="btn-action" onclick="openModal('login')">登录</span>
                <span class="btn-action" style="background:#333;" onclick="openModal('register')">注册</span>
            </div>
            <div id="user-btns" style="display:none;" class="user-stat">
                <span>💰 <b id="my-balance">--</b></span>
                <span style="margin-left:10px; cursor:pointer;" onclick="logout()">退出</span>
            </div>
        </div>
    </div>

    <div class="stats-bar">
        <span>全站 Token: <b style="color:#cc0000" id="global-token">21,000</b></span>
        <span>会员: <b>45,210</b></span>
    </div>

    <div class="container">
        <div id="post-feed">
            <div class="msg-box">🚀 正在通过高速线路连接数据库...</div>
        </div>
    </div>

    <div class="fab-btn" onclick="openPostModal()">+</div>

    <div id="auth-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header"><span id="auth-title">登录</span><span onclick="closeAuth()" style="cursor:pointer">✕</span></div>
            <div class="modal-body">
                <input type="email" id="email" class="input-field" placeholder="邮箱">
                <input type="password" id="password" class="input-field" placeholder="密码">
                <button id="auth-submit" class="btn-submit" onclick="handleAuth()">提交</button>
                <div style="text-align:center; margin-top:10px; color:#004499; cursor:pointer;" id="auth-toggle" onclick="toggleAuth()">没有账号？去注册</div>
            </div>
        </div>
    </div>

    <div id="post-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header"><span>发布新帖</span><span onclick="closePost()" style="cursor:pointer">✕</span></div>
            <div class="modal-body">
                <select id="post-cat" class="input-field">
                    <option value="gpt">ChatGPT 交流</option>
                    <option value="deepseek">DeepSeek 开源</option>
                    <option value="market">悬赏与变现</option>
                </select>
                <input type="text" id="post-title" class="input-field" placeholder="标题 (例如: 谁有DeepSeek微调教程?)">
                <textarea id="post-content" class="textarea-field" placeholder="内容详情..."></textarea>
                
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                    <label>💰 悬赏Token:</label>
                    <input type="number" id="post-bounty" class="input-field" style="width:80px; margin:0;" value="0">
                </div>

                <button class="btn-submit" onclick="submitPost()">立即发布</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase 配置
        const supabaseUrl = 'https://dodvxzmzggxlztuhivvp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvZHZ4em16Z2d4bHp0dWhpdnZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNDI5NjAsImV4cCI6MjA4NDYxODk2MH0.nE8dIJv2u1m5JcELnT6kZhjyOhz9ltj3NsfKwkT1Ajw';
        
        let supabase = null;
        let currentUser = null;
        let isRegister = false;

        async function init() {
            try {
                // 检查 SDK 是否成功加载
                if(!window.supabase) throw new Error("核心组件未加载，请刷新重试");
                
                supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
                
                // 1. 检查用户
                const { data: { user } } = await supabase.auth.getUser();
                if(user) {
                    currentUser = user;
                    setupUserUI();
                }

                // 2. 加载帖子
                loadPosts();

            } catch (err) {
                document.getElementById('err-display').style.display = 'block';
                document.getElementById('err-display').innerText = "系统连接失败: " + err.message;
            }
        }

        // 加载帖子列表
        async function loadPosts() {
            const feed = document.getElementById('post-feed');
            
            const { data, error } = await supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if(error) {
                feed.innerHTML = '<div class="msg-box">⚠️ 读取失败: ' + error.message + '</div>';
                return;
            }

            if(!data || data.length === 0) {
                feed.innerHTML = `
                    <div class="msg-box">
                        <h3>🧐 这里的帖子去哪了？</h3>
                        <p>数据库已连接，但还没有人发帖。</p>
                        <p>点击右下角红色按钮，成为第一个发帖的大神！</p>
                    </div>`;
                return;
            }

            feed.innerHTML = '';
            data.forEach(post => {
                const isBounty = post.bounty > 0;
                // 简单的头像颜色生成
                const colors = ['#e6f4ea', '#fff0e6', '#eef2ff', '#fff7e6'];
                const color = colors[post.id % colors.length] || '#f0f0f0';
                
                const html = `
                    <div class="post-card">
                        <div class="post-avatar" style="background:${color}">${post.category.substring(0,2).toUpperCase()}</div>
                        <div class="post-main">
                            <a class="post-title">${post.title}</a>
                            <div class="post-meta">
                                ${isBounty ? `<span class="tag-bounty">悬赏 ${post.bounty}</span>` : ''}
                                <span>${new Date(post.created_at).toLocaleDateString()}</span>
                                <span>浏览 ${post.view_count || 1}</span>
                            </div>
                        </div>
                    </div>
                `;
                feed.innerHTML += html;
            });
        }

        // 发帖逻辑
        async function submitPost() {
            if(!currentUser) return alert("请先登录！");
            
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            const category = document.getElementById('post-cat').value;
            const bounty = document.getElementById('post-bounty').value;

            if(!title) return alert("标题不能为空");

            const { error } = await supabase.from('posts').insert({
                author_id: currentUser.id, 
                title,
                content,
                category,
                bounty: parseInt(bounty) || 0
            });

            if(error) {
                alert("发帖失败: " + error.message);
            } else {
                alert("发布成功！");
                closePost();
                loadPosts(); // 刷新列表
            }
        }

        // 认证与UI逻辑
        function openPostModal() {
            if(!currentUser) {
                alert("请先登录才能发帖！");
                openModal('login');
            } else {
                document.getElementById('post-modal').style.display = 'flex';
            }
        }

        async function setupUserUI() {
            document.getElementById('guest-btns').style.display = 'none';
            document.getElementById('user-btns').style.display = 'flex';
            
            // 获取用户余额
            const { data } = await supabase.from('profiles').select('token_balance').eq('id', currentUser.id).single();
            if(data) document.getElementById('my-balance').innerText = data.token_balance;
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert("请填写完整");

            if(isRegister) {
                const { error } = await supabase.auth.signUp({ email, password });
                if(error) alert(error.message);
                else {
                    alert("注册申请已提交！\n请务必去邮箱点击确认链接，否则无法登录！");
                    closeAuth();
                }
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if(error) alert(error.message);
                else location.reload();
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        // 弹窗基础控制
        function openModal(type) {
            document.getElementById('auth-modal').style.display = 'flex';
            isRegister = (type === 'register');
            document.getElementById('auth-title').innerText = isRegister ? '新用户注册' : '登录';
        }
        function closeAuth() { document.getElementById('auth-modal').style.display = 'none'; }
        function closePost() { document.getElementById('post-modal').style.display = 'none'; }
        function toggleAuth() {
            isRegister = !isRegister;
            document.getElementById('auth-title').innerText = isRegister ? '新用户注册' : '登录';
            document.getElementById('auth-toggle').innerText = isRegister ? '已有账号？去登录' : '没有账号？去注册';
        }

        setTimeout(init, 100);
    </script>
</body>
</html>

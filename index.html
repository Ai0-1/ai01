<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 原点 | 深度学习社区</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ================= 核心风格 ================= */
        * { box-sizing: border-box; }
        body { background-color: #f5f1e8; color: #333; font-family: "Verdana", sans-serif; font-size: 12px; margin: 0; padding: 0; line-height: 1.5; }
        a { text-decoration: none; color: #333; cursor: pointer; }
        a:hover { text-decoration: underline; background-color: #ddd; }
        .link-blue { color: #004499; font-weight: bold; }
        .link-red { color: #cc0000; }
        
        /* 布局 */
        .main-container { max-width: 100%; margin: 0 auto; background: #fff; border-bottom: 2px solid #bba378; }
        @media (min-width: 600px) { .main-container { max-width: 900px; border: 1px solid #c8c0b0; border-top: none; } }
        
        /* 导航 */
        .top-nav { background: #4b4b4b; color: #ccc; padding: 0 10px; height: 28px; line-height: 28px; display: flex; justify-content: space-between; font-size: 11px; }
        .top-nav a { color: #fff; margin-left: 10px; }
        
        /* 头部 */
        .header-section { padding: 12px 10px; background: #fffdf9; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #dcdcdc; }
        .logo-text { font-size: 22px; font-weight: 900; color: #8b5a2b; font-family: "Georgia", serif; letter-spacing: -1px; }
        
        /* 统计条 */
        .stats-bar { background: #fffaf0; border: 1px solid #e6dcc6; margin: 5px; padding: 6px; font-size: 11px; color: #666; display: flex; flex-wrap: wrap; gap: 10px; }
        
        /* 版块 */
        .forum-box { margin: 8px 5px; border: 1px solid #cdcdcd; background: #fff; }
        .box-header { background: linear-gradient(to bottom, #fcfaf5, #ebe5d2); padding: 6px 10px; border-bottom: 1px solid #c8c0b0; color: #8b4513; font-weight: bold; font-size: 13px; }
        .forum-row { display: flex; padding: 8px; border-bottom: 1px dotted #ccc; align-items: center; }
        .f-icon { width: 32px; height: 32px; background: #f4f4f4; border: 1px solid #bbb; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #666; margin-right: 8px; }
        .f-content { flex: 1; }
        .f-title { font-size: 13px; font-weight: bold; color: #004499; display: block; }
        .f-stat { width: 60px; text-align: right; font-size: 10px; color: #999; }

        /* ================= 弹窗组件 ================= */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
        .modal-box { background: #f5f1e8; border: 2px solid #8b5a2b; width: 300px; padding: 2px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-header { background: #8b5a2b; color: white; padding: 5px 10px; font-weight: bold; display: flex; justify-content: space-between; }
        .modal-body { padding: 20px; text-align: center; }
        .input-field { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; }
        .btn-submit { background: #004499; color: white; border: 1px solid #002266; padding: 6px 20px; cursor: pointer; font-weight: bold; width: 100%; }
        .toggle-link { display: block; margin-top: 10px; color: #004499; text-decoration: underline; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div>
            <span id="sys-status" style="color:#22c55e;">🟢 数据金库已连接</span>
        </div>
        <div id="auth-links">
            <a href="#">收藏</a>
            <a href="#" onclick="openModal('register')">注册</a>
            <a href="#" onclick="openModal('login')">登录</a>
        </div>
        <div id="user-info" style="display:none;">
            <span style="color:#ddd;">用户: <b id="username-display" style="color:#fff;">--</b></span>
            <a href="#" onclick="logout()">[退出]</a>
        </div>
    </div>

    <div class="main-container">
        <div class="header-section">
            <div>
                <div class="logo-text">AI 原点</div>
                <div style="font-size: 10px; color: #999;">科技向善 · 0 到 1 · 价值社区</div>
            </div>
            <div style="text-align:right;">
                <div style="font-size:10px; color:#888;">我的 Token</div>
                <div style="font-size:16px; font-weight:bold; color:#cc0000;" id="my-token">--</div>
            </div>
        </div>

        <div class="stats-bar">
            <div>Token池: <b class="link-red" id="pool-token">--</b></div>
            <div style="border-left:1px solid #ddd; padding-left:10px;">会员: <b>1</b></div>
        </div>

        <div class="forum-box">
            <div class="box-header">🌍 国际主流模型</div>
            <div class="forum-row">
                <div class="f-icon">GPT</div>
                <div class="f-content"><a href="#" class="f-title">ChatGPT 综合交流区</a></div>
                <div class="f-stat"><span class="link-red">102</span><br>今日</div>
            </div>
        </div>
        
        <div class="forum-box" style="border-color:#e6a23c;">
            <div class="box-header" style="background:#fff7e6; color:#d48806;">💰 变现与集市</div>
            <div class="forum-row">
                <div class="f-icon">$</div>
                <div class="f-content">
                    <a href="#" class="f-title">任务悬赏 & 兼职大厅</a>
                    <div style="font-size:11px; color:#666;">求小红书Prompt (200 Token)</div>
                </div>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <span id="modal-title">通行证办理</span>
                <span style="cursor:pointer;" onclick="closeModal()">X</span>
            </div>
            <div class="modal-body">
                <input type="email" id="email" class="input-field" placeholder="真实邮箱 (需接收验证邮件)">
                <input type="password" id="password" class="input-field" placeholder="密码 (至少6位)">
                <button class="btn-submit" onclick="handleAuth()" id="btn-action">立即注册</button>
                <span class="toggle-link" id="toggle-text" onclick="toggleMode()">已有账号？点击登录</span>
            </div>
        </div>
    </div>

    <script>
        // Supabase配置
        const supabaseUrl = 'https://dodvxzmzggxlztuhivvp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvZHZ4em16Z2d4bHp0dWhpdnZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNDI5NjAsImV4cCI6MjA4NDYxODk2MH0.nE8dIJv2u1m5JcELnT6kZhjyOhz9ltj3NsfKwkT1Ajw';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let isRegisterMode = true;

        // 初始化
        async function init() {
            // 查Token池
            const { data } = await supabase.from('system_stats').select('stat_value').eq('stat_key', 'total_tokens_mined').single();
            if(data) document.getElementById('pool-token').innerText = data.stat_value.toLocaleString();

            // 查用户登录状态
            const { data: { user } } = await supabase.auth.getUser();
            if (user) showLoggedIn(user);
        }
        init();

        // 弹窗控制
        function openModal(mode) {
            document.getElementById('auth-modal').style.display = 'flex';
            if (mode === 'login') {
                isRegisterMode = false;
                document.getElementById('modal-title').innerText = '用户登录';
                document.getElementById('btn-action').innerText = '登录进入';
                document.getElementById('toggle-text').innerText = '没有账号？点击注册';
            } else {
                isRegisterMode = true;
                document.getElementById('modal-title').innerText = '新用户注册';
                document.getElementById('btn-action').innerText = '立即注册';
                document.getElementById('toggle-text').innerText = '已有账号？点击登录';
            }
        }
        function closeModal() { document.getElementById('auth-modal').style.display = 'none'; }
        function toggleMode() { isRegisterMode ? openModal('login') : openModal('register'); }

        // 注册/登录逻辑
        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) return alert('请填写完整');
            document.getElementById('btn-action').innerText = '处理中...';

            try {
                if (isRegisterMode) {
                    // 注册
                    const { error } = await supabase.auth.signUp({ email, password });
                    if (error) throw error;
                    alert('注册成功！请去你的邮箱点击确认链接，然后回来登录！');
                    openModal('login'); // 自动切到登录页
                } else {
                    // 登录
                    const { error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    location.reload(); // 登录成功刷新页面
                }
            } catch (err) {
                alert('错误: ' + err.message);
                document.getElementById('btn-action').innerText = '重试';
            }
        }

        function showLoggedIn(user) {
            document.getElementById('auth-links').style.display = 'none';
            document.getElementById('user-info').style.display = 'block';
            document.getElementById('username-display').innerText = user.email.split('@')[0];
            document.getElementById('my-token').innerText = "100"; // 初始显示
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }
    </script>
</body>
</html>
